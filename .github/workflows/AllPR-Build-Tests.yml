name: Build and Test

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - all

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Tuist & Dependencies
        uses: jdx/mise-action@v2

      - name: Run Tests
        run: tuist test RailMapiOSTests | xcbeautify --renderer github-actions
