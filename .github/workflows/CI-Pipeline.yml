name: CI Pipeline

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main

jobs:
  lint:
    runs-on: macos-latest      
    steps:
      - uses: actions/checkout@v4
      - uses: cirruslabs/swiftlint-action@v1
        with:
          version: latest

  build-and-test:
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
        
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify Swift Version
        run: swift --version

      - name: Generate Xcode Project
        uses: jdx/mise-action@v2
        
      - name: Ensure Tuist Version is Pinned
        run: mise use --pin tuist
        
      - name: Generate Xcode Project
        run: tuist generate

      - name: Build Project
        run: xcodebuild build -project RailMapiOS.xcodeproj -scheme RailMapiOS -configuration Debug

      - name: Run Tests
        run: xcodebuild test -project RailMapiOS.xcodeproj -scheme RailMapiOS -destination -configuration Debug
