name: CI Pipeline

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cirruslabs/swiftlint-action@v1
        with:
          version: latest

  build-and-test:
    runs-on: macos-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Swift 6 Toolchain
        run: |
          curl -O https://download.swift.org/swift-6.0-branch/xcode/swift-6.0-DEVELOPMENT-SNAPSHOT-latest/swift-6.0-DEVELOPMENT-SNAPSHOT-latest-osx.pkg
          sudo installer -pkg swift-6.0-DEVELOPMENT-SNAPSHOT-latest-osx.pkg -target /

      - name: Set Swift 6 as default
        run: |
          echo "SWIFT_EXEC=/Library/Developer/Toolchains/swift-6.0-DEVELOPMENT-SNAPSHOT.xctoolchain/usr/bin/swiftc" >> $GITHUB_ENV
          echo "PATH=/Library/Developer/Toolchains/swift-6.0-DEVELOPMENT-SNAPSHOT.xctoolchain/usr/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Swift Version
        run: swift --version

      - name: Install Dependencies (Mise + Tuist)
        uses: jdx/mise-action@v2

      - name: Ensure Tuist Version is Pinned
        run: mise use --pin tuist

      - name: Build Project
        run: tuist build | xcbeautify

      - name: Run Tests
        run: tuist test --test-targets RailMapiOSTests | xcbeautify
